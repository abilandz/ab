site_name: This is a new name, is it really??
nav:
  - Home: index.md
  - Lecture 1: SS2026/Lecture_1/Trivia.md
  - Lecture 2: SS2026/Lecture_2/Lecture_2.md
  - Lecture 3: SS2026/Lecture_3/Lecture_3.md
  - Lecture 4: SS2026/Lecture_4/Lecture_4.md
