theme:
#  name: mkdocs
  name: material
#  name: readthedocs
  analytics:
    gtag: G-ABC123
  shortcuts:
    help: 191    # ?
    next: 78     # n
    previous: 80 # p
    search: 83   # s

# here I mantain extra CSS but common for all themes:
extra_css:
  - stylesheets/extra.css

# here I maintain extra CSS but conditional and specific for each theme:
hooks:
  - docs/hooks/conditional_css.py

# support for math:
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js # online math
#  - javascripts/tex-mml-chtml.js # offline math


